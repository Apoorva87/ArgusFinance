[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argusfinance"
version = "0.1.0"
description = "Local-first options research workbench"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic",
    "duckdb",
    "fastapi",
    "ib_async>=2.1,<3",
    "mcp",
    "pyarrow",
    "pydantic-settings",
    "sqlalchemy",
    "typer",
    "uvicorn",
]

[project.scripts]
argusfinance = "argusfinance.cli:app"

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/argusfinance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
files = ["src/argusfinance"]
python_version = "3.12"
strict = true
